<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Detail Page</title>
    <style>
        body {
            background-color: #ffffff;
            color: #222222;
            font-family: sans-serif;
            margin: 0;
            padding: 30px;
            transition: background-color 0.3s, color 0.3s;
        }

        .toggle-btn {
            background-color: #333545; /* Dark slate */
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .movie-card {
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
        }

        /* Dark Mode Theme Configurations via Class cascading */
        body.dark-mode {
            background-color: #1f2533; /* BookMyShow dark layout color tone */
            color: #f2f5f9;
        }

        body.dark-mode .movie-card {
            border-color: #31394d;
            background-color: #2b3144;
        }

        body.dark-mode .toggle-btn {
            background-color: #f84464; /* BMS Crimson Pink accent */
        }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleTheme()">Switch Theme</button>

    <div class="movie-card">
        <h1>Welcome to the Jungle</h1>
        <p><strong>Genre:</strong> Sci-Fi / Drama / Adventure</p>
        <p>A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.</p>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
