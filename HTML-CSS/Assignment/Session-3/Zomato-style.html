<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato-style food order form</title>
</head>
<body>
    <h1 align="center">Food Order Form</h1>
    <form action="">
    <table align="center" border="1" cellspacing="10px" cellpadding="10px">
        <tr>
           <th>Order ID</th>
           <td>
            <input type="text" id="order-id" name="order_id" value="ORD12345" disabled>
           </td>
        </tr>

    <tr>
            <th>Username:</th>
            <td>
                <input type="text" name="" id="" placeholder="Enter your Full name" required>
            </td>
        </tr>

        <tr>
            <th>Select Food Item</th>
            <td>
                 <select name="city" id="" required>
                    <option value="" disabled selected>Choose a dish...</option>
                    <option value="butter-chicken">Butter Chicken with Butter Naan</option>
                    <option value="hyderabadi-biryani">Hyderabadi Chicken Biryani</option>
                    <option value="margherita-pizza">Classic Margherita Pizza</option>
                    <option value="paneer-tikka">Paneer Tikka Roll</option>
                 </select>
            </td>
        </tr>
        <tr>
            <th>Quantity</th>
            <td>
                <input type="number" id="Quantity" name="quantity" min="1" max="10" placeholder="1" required>
            </td>
        </tr>
        <tr>
            <th>Delivery Instructions</th>
            <td>
                 <textarea name="" id="" placeholder="e.g., Leave at the gate, Don't ring the bell..."></textarea>
            </td>
        </tr>
        <tr>
            <td>
                <input type="Reset" value="Reset">
                <input type="Submit" value="Place Order">
            </td>
        </tr>
</body>
</html>
