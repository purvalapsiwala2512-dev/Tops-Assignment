<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Style List Card</title>
</head>
<body>
    <article class="restaurant-card">
    <header>
        <img src="images.jpg" alt="Hyderabadi Biryani served in a clay pot">
        <h2>Spice Paradise</h2>
        <p class="cuisine">North Indian, Mughlai, Biryani</p>
    </header>

    <div class="card-body">
        <p class="location">Connaught Place, New Delhi</p>
        <p class="price-for-two">₹400 for two</p>
    </div>

    <footer>
        <div class="rating-badge">
            <span class="rating">4.2 ★</span>
            <span class="reviews-count">(500+ Reviews)</span>
        </div>
        <div class="delivery-meta">
            <span class="time">35 mins</span>
            <span class="distance">2.5 km</span>
        </div>
    </footer>
</article>
</body>
</html>
