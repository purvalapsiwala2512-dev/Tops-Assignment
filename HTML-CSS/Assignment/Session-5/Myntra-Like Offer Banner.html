<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Offer Banner</title>
    <style>
       .myntra-banner {
            background-color: #fe506e;
            padding: 15px 20px;
            text-align: center;
            border-radius: 2px;
        }

        .banner-text {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        .banner-subtext {
            font-family: Arial, sans-serif;
            color: #fff3f5;
            font-size: 14px;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>
    <div class="myntra-banner">
        <p class="banner-text">End of Season Sale: 50% - 80% OFF</p>
        <p class="banner-subtext">Valid on Top Brands • Limited Time Only</p>
    </div>
</body>
</html>
