<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Flipkart-style product review</title>
</head>
<body>
     <h1 align="center">Product Review</h1>
    <form action="">
    <table align="center" border="1" cellspacing="10px" cellpadding="10px">
        <tr>
            <th>Username:</th>
            <td>
                <input type="text" name="" id="" placeholder="Enter your name" required>
            </td>
        </tr>
        <tr>
            <th>Rating</th>
            <td>
                <select name="Rating" id="" required>
                  <option value="" disabled selected>Select Rating ★</option>
                    <option value="1">1 ★ (Poor)</option>
                    <option value="2">2 ★ (Fair)</option>
                    <option value="3">3 ★ (Average)</option>
                    <option value="4">4 ★ (Good)</option>
                    <option value="5">5 ★ (Excellent)</option>
                </select>
            </td>
        </tr>
        <tr>
            <th>Review Description</th>
            <td>
                <textarea name="" id="" placeholder="Description should be at least 20 characters..." minlength="20" required></textarea>
            </td>
        </tr>
        <tr>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>
</body>
</html>
