<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist Selector</title>
    <style>
        body {
            background-color: #121212;
            font-family: sans-serif;
            padding: 20px;
        }

        /* Class Selector: Applies uniform rules to all playlist track rows */
        .playlist-item {
            background-color: #181818;
            color: #ffffff;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* ID Selector: Overrides the class background rule to highlight the current song */
        #currently-playing {
            background-color: #1DB954; /* Spotify Green */
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="playlist-container">
        <div class="playlist-item">
            <span>1. Blinding Lights - The Weeknd</span>
            <span>3:20</span>
        </div>
        
        <div class="playlist-item" id="currently-playing">
            <span>2. Starboy - The Weeknd (Active)</span>
            <span>3:50</span>
        </div>
        
        <div class="playlist-item">
            <span>3. Save Your Tears - The Weeknd</span>
            <span>3:35</span>
        </div>
    </div>
</body>
</html>
